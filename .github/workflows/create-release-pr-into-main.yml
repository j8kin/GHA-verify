name: Create Release PR

on:
  push:
    branches:
      - develop

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine version
        id: version
        run: |
          main_version=$(node -e "
            const { execSync } = require('child_process');
            try {
              const pkg = JSON.parse(execSync('git show origin/main:package.json').toString());
              console.log(pkg.version);
            } catch (e) {
              console.log('0.0.0');
            }
          ")
          develop_version=$(node -p "require('./package.json').version")

          IFS='.' read -r mj mn mp <<< "$main_version"
          expected_next="$mj.$mn.$((mp + 1))"

          if [ "$develop_version" = "$main_version" ] || [ "$develop_version" != "$expected_next" ]; then
            # Fresh start or manual major/minor bump: do one patch bump
            new_version=$(npm version patch --no-git-tag-version | sed 's/^v//')
            echo "should_commit=true" >> $GITHUB_OUTPUT
          else
            # Already at the correct next version: include new code without re-bumping
            new_version=$develop_version
            echo "should_commit=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$new_version" >> $GITHUB_OUTPUT

      - name: Commit and push version bump
        if: steps.version.outputs.should_commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Check if PR already exists
        id: check-pr
        run: |
          pr_number=$(gh pr list --base main --head develop --json number -q '.[0].number')
          if [ -z "$pr_number" ]; then
            echo "pr_exists=false" >> $GITHUB_OUTPUT
          else
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Create Pull Request
        if: steps.check-pr.outputs.pr_exists == 'false'
        run: |
          gh pr create \
            --base main \
            --head develop \
            --title "chore: release ${{ steps.version.outputs.version }}" \
            --body "Automated release PR. Merge to \`main\` to create a new release." \
            --label release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Update Pull Request
        if: steps.check-pr.outputs.pr_exists == 'true'
        run: |
          gh pr edit ${{ steps.check-pr.outputs.pr_number }} \
            --title "chore: release ${{ steps.version.outputs.version }}" \
            --body "Automated release PR. Merge to \`main\` to create a new release."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
