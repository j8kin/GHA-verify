name: Create Release PR

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  create-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine version
        id: version
        run: |
          # Version in develop before this PR was merged
          before_version=$(git show ${{ github.event.pull_request.base.sha }}:package.json | node -e "
            let d = '';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => console.log(JSON.parse(d).version));
          ")

          # Version in develop now (after merge)
          current_version=$(node -p "require('./package.json').version")

          # Check if a release PR to main already exists
          pr_number=$(gh pr list --base main --head develop --json number -q '.[0].number')
          echo "pr_number=${pr_number}" >> $GITHUB_OUTPUT

          if [ -z "$pr_number" ]; then
            # No release PR: always bump and create one
            new_version=$(npm version patch --no-git-tag-version | sed 's/^v//')
            echo "should_commit=true" >> $GITHUB_OUTPUT
            echo "pr_exists=false" >> $GITHUB_OUTPUT
          elif [ "$before_version" != "$current_version" ]; then
            # Release PR exists but user manually changed the version: bump from new version
            new_version=$(npm version patch --no-git-tag-version | sed 's/^v//')
            echo "should_commit=true" >> $GITHUB_OUTPUT
            echo "pr_exists=true" >> $GITHUB_OUTPUT
          else
            # Release PR exists, version untouched: include code in current release as-is
            new_version=$current_version
            echo "should_commit=false" >> $GITHUB_OUTPUT
            echo "pr_exists=true" >> $GITHUB_OUTPUT
          fi

          echo "version=$new_version" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit and push version bump
        if: steps.version.outputs.should_commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Create Pull Request
        if: steps.version.outputs.pr_exists == 'false'
        run: |
          gh pr create \
            --base main \
            --head develop \
            --title "chore: release ${{ steps.version.outputs.version }}" \
            --body "Automated release PR. Merge to \`main\` to create a new release." \
            --label release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Update Pull Request
        if: steps.version.outputs.pr_exists == 'true' && steps.version.outputs.should_commit == 'true'
        run: |
          gh pr edit ${{ steps.version.outputs.pr_number }} \
            --title "chore: release ${{ steps.version.outputs.version }}" \
            --body "Automated release PR. Merge to \`main\` to create a new release."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
