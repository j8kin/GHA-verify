name: Create Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  tag-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Set branch names
        id: branches
        run: |
          working_branch="${{ vars.WORKING_BRANCH }}"
          release_branch="${{ vars.RELEASE_BRANCH }}"
          echo "working-branch=${working_branch:-develop}" >> $GITHUB_OUTPUT
          echo "release-branch=${release_branch:-main}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.branches.outputs.release-branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release-notes
        run: |
          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$previous_tag" ]; then
            notes=$(git log --pretty=format:"- %h: %s" | head -20)
          else
            notes=$(git log ${previous_tag}..HEAD --pretty=format:"- %h: %s")
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target ${{ steps.branches.outputs.release-branch }} \
            --title "Release v${{ steps.version.outputs.version }}" \
            --notes "${{ steps.release-notes.outputs.notes }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
