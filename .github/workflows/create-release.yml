name: Create Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  tag-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Set branch names
        id: branches
        run: |
          working_branch="${{ vars.WORKING_BRANCH }}"
          release_branch="${{ vars.RELEASE_BRANCH }}"
          echo "working-branch=${working_branch:-develop}" >> $GITHUB_OUTPUT
          echo "release-branch=${release_branch:-main}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.branches.outputs.release-branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine version from PR selection
        id: version
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          version=$(echo "$PR_BODY" | grep -oP '(?<=- \[x\] )\d+\.\d+\.\d+' | head -1)

          if [ -z "$version" ]; then
            latest_tag=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//')
            current=${latest_tag:-0.0.0}
            IFS='.' read -r major minor patch <<< "$current"
            version="$major.$minor.$((patch + 1))"
          fi

          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release-notes
        run: |
          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          filter='Merge pull request|chore: bump version'

          if [ -z "$previous_tag" ]; then
            notes=$(git log --pretty=format:"- %h: %s" | grep -vE "$filter" | head -20)
          else
            notes=$(git log ${previous_tag}..HEAD --pretty=format:"- %h: %s" | grep -vE "$filter")
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target ${{ steps.branches.outputs.release-branch }} \
            --title "Release v${{ steps.version.outputs.version }}" \
            --notes "${{ steps.release-notes.outputs.notes }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
